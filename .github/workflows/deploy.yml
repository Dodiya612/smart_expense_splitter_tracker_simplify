name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: "Deploy Backend · Render"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render Deployment
        id: trigger-render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render deploy hook..."
            HTTP_RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            echo "Render Deploy Hook HTTP response code: $HTTP_RESPONSE"
            if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
              echo "✅ Render deployment hook triggered successfully."
            else
              echo "::error::Render deploy hook returned unexpected status: $HTTP_RESPONSE"
              cat response.txt
              exit 1
            fi
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Render automatically deploys on push to main via native Render GitHub App and render.yaml."
          fi

      - name: Verify Backend Health Endpoint (if URL provided)
        if: success()
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -n "$BACKEND_URL" ]; then
            echo "Verifying health endpoint at ${BACKEND_URL}/api/v1/health..."
            # Retry loop with backoff while Render builds and deploys
            MAX_ATTEMPTS=15
            ATTEMPT=1
            SUCCESS=false

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: Checking ${BACKEND_URL}/api/v1/health..."
              HTTP_CODE=$(curl -s -o health.json -w "%{http_code}" "${BACKEND_URL}/api/v1/health" || echo "000")
              if [ "$HTTP_CODE" -eq 200 ]; then
                echo "✅ Health check passed with HTTP 200 OK!"
                cat health.json
                SUCCESS=true
                break
              fi
              echo "Health check returned HTTP $HTTP_CODE. Waiting 15s before retry..."
              sleep 15
              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "::error::Backend health check failed after $MAX_ATTEMPTS attempts."
              exit 1
            fi
          else
            echo "ℹ️ RENDER_BACKEND_URL secret is not set. Skipping live health probe."
          fi

  check-frontend-deploy:
    name: "Check Frontend Deploy · Vercel"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Web Frontend Availability
        run: |
          echo "Inspecting eligible web frontend outside mobile/..."
          if [ -d "frontend" ] || [ -f "vercel.json" ]; then
            echo "Web frontend configuration detected outside mobile/."
            if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
              echo "Vercel credentials present. Proceeding with deployment."
            else
              echo "ℹ️ Vercel Git integration deploys automatically on main push."
            fi
          else
            echo "=========================================================================="
            echo "NOTICE: Frontend Deployment Blocker"
            echo "No eligible web frontend found outside mobile/."
            echo "per project guidelines, mobile/ is strictly reserved for mobile and must"
            echo "not be included in deployment configurations or workflows."
            echo "Vercel web frontend deployment is documented as blocked until a dedicated"
            echo "web frontend or web bundle is established outside mobile/."
            echo "=========================================================================="
          fi
