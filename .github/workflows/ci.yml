name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend checks ──────────────────────────────────────────────
  frontend-lint:
    name: "Frontend · ESLint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo lint

  frontend-typecheck:
    name: "Frontend · TypeScript"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-test:
    name: "Frontend · Jest"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Run Jest tests (if configured)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)" 2>/dev/null; then
            npm test
          else
            echo "::warning::Jest is not yet configured — no 'test' script in package.json. Skipping."
          fi

  # ── Detect backend ────────────────────────────────────────────────
  detect-backend:
    name: "Detect backend code"
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f backend/pyproject.toml ] || ls backend/requirements*.txt 1>/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Backend checks ───────────────────────────────────────────────
  backend-lint:
    name: "Backend · Ruff"
    needs: detect-backend
    if: needs.detect-backend.outputs.exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  backend-typecheck:
    name: "Backend · mypy"
    needs: detect-backend
    if: needs.detect-backend.outputs.exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt || pip install -e ".[dev]"
      - run: pip install mypy
      - run: mypy .

  backend-test:
    name: "Backend · pytest"
    needs: detect-backend
    if: needs.detect-backend.outputs.exists == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: coinscious_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/coinscious_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt || pip install -e ".[dev]"
      - run: pip install pytest
      - run: pytest

  # ── Secret scanning ──────────────────────────────────────────────
  gitleaks:
    name: "Security · Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed 's/.*"v\(.*\)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      # Verify the canary fake key IS detectable (proves scanning works).
      # gitleaks returns exit code 1 when leaks are found.
      - name: Validate canary detection
        run: |
          set +e
          gitleaks detect --no-git --source tests/ --config .gitleaks-canary.toml --verbose
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "✅ Canary fake key detected by Gitleaks"
          else
            echo "::error::Gitleaks did NOT detect the canary fake key (exit code $EXIT_CODE)."
            exit 1
          fi

      # Main scan — uses .gitleaks.toml which allowlists the canary file,
      # so only real leaked secrets cause a failure.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
